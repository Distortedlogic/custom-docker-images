mqtt:
  enabled: false

auth:
  enabled: true

semantic_search:
  enabled: true
  reindex: true
  model_size: small

notifications:
  enabled: true
  email: frigate@localhost

ffmpeg:
  hwaccel_args: preset-nvidia

detectors:
  onnx:
    type: onnx

model:
  model_type: yolo-generic
  path: /config/model_cache/yolov9-s-640.onnx
  input_tensor: nchw
  input_dtype: float
  width: 640
  height: 640
  labelmap_path: /labelmap/coco-80.txt

go2rtc:
  streams:
    driveway:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.100.130:554/h265Preview_01_main
      - ffmpeg:driveway#audio=opus
    driveway_sub:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.100.130:554/h264Preview_01_sub

cameras:
  driveway:
    enabled: true
    onvif:
      host: 192.168.100.130
      port: 8000
      user: admin
      password: "{FRIGATE_CAMERA_PASSWORD}"
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        - path: rtsp://127.0.0.1:8554/driveway
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/driveway_sub
          input_args: preset-rtsp-restream
          roles:
            - detect

    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5

    motion:
      mask:
        - 0,0,640,0,640,170,0,170

    zones:
      parking:
        coordinates: 0,188,130,180,182,299,0,315
        objects:
          - person
          - car
          - motorcycle
          - bicycle
      approach:
        coordinates: 83,168,227,170,231,184,87,184
        objects:
          - person
          - car
          - motorcycle
          - bicycle
      street:
        coordinates: 74,172,640,168,640,360,132,360
        objects:
          - person
          - car
          - motorcycle
          - bicycle

    objects:
      track:
        - person
        - car
        - motorcycle
        - bicycle
      filters:
        person:
          min_area: 100
          max_area: 8000
          threshold: 0.7
        car:
          min_area: 600
          max_area: 40000
          threshold: 0.7
        motorcycle:
          min_area: 300
          max_area: 8000
          threshold: 0.7
        bicycle:
          min_area: 200
          max_area: 5000
          threshold: 0.7

    review:
      alerts:
        labels:
          - person
          - car
          - motorcycle
          - bicycle
        required_zones:
          - parking
          - approach
      detections:
        labels:
          - person
          - car
          - motorcycle
          - bicycle

    record:
      enabled: true
      alerts:
        retain:
          days: 30
      detections:
        retain:
          days: 7

      continuous:
        days: 0
      motion:
        days: 3
    snapshots:
      enabled: true
      retain:
        default: 14
version: 0.17-0
